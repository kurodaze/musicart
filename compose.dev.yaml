services:
  musicart:
    build:
      context: .
      args:
        PROFILE: dev
    container_name: musicart-dev
    restart: unless-stopped
    init: true
    # must read musicart.toml and own data/: your `id -u`:`id -g` if that isn't 1000
    user: "1000:1000"
    # userns_mode: keep-id   # rootless Podman
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./musicart.toml:/app/musicart.toml:ro,Z
      # yt-dlp, the Spotify login and the cookies file
      - ./data:/app/data:Z
