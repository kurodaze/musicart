[package]
name = "musicart"
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# yt-dlp and deno are downloaded and verified on first use, see src/tools.rs
sha2 = "0.10"
flate2 = "1"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "voice"] }
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "serenity", "rustls", "tungstenite"] }
# containers songbird should read: webm (YouTube's Opus), mp4/aac and ogg/vorbis (Spotify's), mp3 (SoundCloud)
symphonia = { version = "0.5", default-features = false, features = ["mkv", "isomp4", "aac", "pcm", "ogg", "vorbis", "mp3"] }
# optional: Spotify's own audio for Spotify links, on a Premium account
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false }
librespot-audio = { version = "0.8", default-features = false }
# the query in a Spotify search URI
form_urlencoded = "1"
# Pin so librespot-core's build.rs resolves a compatible vergen stack.
vergen = "=9.0.6"
vergen-gitcl = "=1.0.5"
vergen-lib = "=0.1.6"
togematch = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[profile.release]
lto = "fat"
strip = true
panic = "abort"
codegen-units = 1

[profile.dev]
debug = 1

# songbird with a STUN option, see vendor/songbird/VENDORED.md
[patch.crates-io]
songbird = { path = "vendor/songbird" }
